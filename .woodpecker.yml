# Woodpecker — robotico-repository-mongodb-csharp
# MUST: Version in Directory.Build.props → tag v{Version} → pack → download.robotico.dev
# PR/main verify: pack-projects only (integration tests need Docker or ROBOTICO_MONGO_CONNECTION).

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  restore-build-test:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - bash scripts/ci-build-pack-projects.sh
    when:
      - event: [pull_request, push]

  release:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      PUBLISH_TOKEN:
        from_secret: publish_token
      GITEA_TOKEN:
        from_secret: gitea_token
      PACK_VERSION_PROJECT: src/Robotico.Repository.MongoDb/Robotico.Repository.MongoDb.csproj
    commands:
      - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
      - bash scripts/ci-build-pack-projects.sh
      - bash scripts/woodpecker-release.sh
    when:
      - event: push
        branch: main
        path:
          exclude:
            - README.md
